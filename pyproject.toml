[project]
name = "diplomacy-rlm"
version = "0.1.0"
description = "Recursive Language Model harness for Diplomacy"
readme = "SPEC.md"
requires-python = ">=3.11"
dependencies = [
  "dill>=0.3.8",
]

[project.scripts]
diplomacy-rlm = "rlm_diplomacy.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
testpaths = ["tests"]
