[project]
name = "diplomacy-rlm"
version = "0.1.0"
description = "Recursive Language Model harness for Diplomacy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dill>=0.3.8",
  "openai>=2.17.0",
  "rich>=13.7.0",
  "rlm @ git+https://github.com/alexzhang13/rlm.git@7436fcfd6d0283fb636808d2e5b06b881e64591a",
]

[project.optional-dependencies]
modal = [
  "modal>=0.74.0",
]

[project.scripts]
diplomacy-rlm = "rlm_diplomacy.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
testpaths = ["tests"]
