[project]
name = "twenty-questions"
version = "0.1.0"
description = "20 Questions game between two RLM agents"
readme = "README.md"
authors = [
    { name = "Nick Landshark", email = "nicklandshark@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "rich>=13.0.0",
]

[project.scripts]
twenty-questions = "twenty_questions.main:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
